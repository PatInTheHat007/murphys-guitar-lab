<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lessons — Murphy's Guitar Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Outfit:wght@400;520;650&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0F1115;--surface:#1C1C1C;--surface-2:#181C22;--border:#303741;
  --text:#F5F1E8;--muted:#B8B2A8;--accent:#C9A96E;--accent-hover:#D4B67A;
  --good:#5CCB91;--side:240px
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Outfit,system-ui,sans-serif;line-height:1.65;font-size:17px}
h1,h2,h3,.mark{font-family:Fraunces,Georgia,serif;letter-spacing:-.02em;line-height:1.2}
h3{margin:1.6rem 0 .4rem}
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
aside{background:var(--surface-2);border-right:1px solid var(--border);padding:1rem .8rem 6.5rem;position:sticky;top:0;height:100vh;overflow:auto}
.mark{color:var(--text);margin:0;font-size:1.05rem;text-decoration:none;display:block}
.mark span{color:var(--accent)}
.mark em{display:block;font-style:normal;font-family:Outfit,sans-serif;font-size:.72rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:.2rem}
aside nav{display:flex;flex-direction:column;gap:.1rem;margin-top:.9rem}
aside button.nav{text-align:left;background:transparent;color:var(--muted);border:0;padding:.45rem .6rem;border-radius:10px;cursor:pointer;font:520 .85rem Outfit,sans-serif}
aside button.nav.on{background:var(--surface);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
aside button.nav.done::after{content:" ✓";color:var(--good)}
aside .nav-sep{margin:.8rem .6rem .2rem;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.page{display:none;padding:1.1rem 1.3rem 8rem;max-width:840px}
.page.on{display:block}
.hero{position:relative;overflow:hidden;min-height:190px;background:radial-gradient(500px 180px at 100% 0%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 60%),var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.2rem 160px 1.2rem 1.2rem}
.hero h1,.hero h2{margin:.2rem 0 .4rem}
.hero p{margin:.3rem 0}
.pat-btn{position:absolute;right:-6px;bottom:-10px;background:none;border:0;padding:0;border-radius:0;cursor:pointer}
.pat-btn img{height:200px;display:block;mask-image:linear-gradient(to top,transparent 0%,#000 16%,#000)}
.eyebrow{letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-size:.7rem;margin:0 0 .4rem}
p,li,td{color:var(--muted)}
strong,th{color:var(--text)}
code{background:#101318;border:1px solid var(--border);padding:0 .35rem;border-radius:6px;color:var(--text)}
.learn{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:.7rem 1rem;margin:1rem 0}
.learn ul{margin:.25rem 0 0;padding-left:1.2rem}
.plain{background:var(--surface-2);border-left:3px solid var(--accent);padding:.75rem 1rem;border-radius:0 12px 12px 0}
ol.steps{counter-reset:s;list-style:none;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-left:2.3rem;margin:.6rem 0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:.1rem;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--accent);color:#1A140C;font-weight:650;font-size:.82rem;display:grid;place-items:center}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:.9rem 1rem;margin:.55rem 0}
.card h3{margin:0 0 .3rem}
.card ul{padding-left:1.1rem;margin:.4rem 0 .7rem;font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:.6rem 0}
.center{justify-content:center;text-align:center}
button,input{font:650 .86rem Outfit,sans-serif;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:.5rem .9rem;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border:0;color:#1A140C}
button.primary:hover{background:var(--accent-hover)}
button.good{background:#1e3d2c;border-color:#2d6a44}
.done-box{display:flex;gap:.7rem;align-items:flex-start;background:#15241b;border:1px solid #2d6a44;border-radius:14px;padding:.8rem 1rem;margin:1.6rem 0 0;cursor:pointer}
.done-box input{width:1.25rem;height:1.25rem;margin:.2rem 0 0;padding:0;border-radius:4px;accent-color:var(--good);flex:none}
.done-box span{color:var(--text)}
.lab{position:fixed;left:var(--side);right:0;bottom:0;z-index:40;background:#0b0d11;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:.32rem;align-items:center;padding:.5rem .7rem}
.lab .label{color:var(--muted);font-size:.78rem;margin-right:.1rem}
.now{color:var(--accent);font-size:.82rem}
.pager{display:flex;gap:.45rem;margin-top:1.1rem}
pre.tab{font:600 13px/1.45 ui-monospace,Menlo,monospace;background:#101318;color:var(--text);padding:.7rem .85rem;border-radius:12px;overflow:auto;border:1px solid var(--border);margin:.4rem 0}
.pocket{display:none;background:var(--surface);border:1px solid var(--accent);border-radius:16px;padding:.8rem 1rem;margin:.55rem 0}
.pocket.on{display:block}
.pocket p{margin:0;color:var(--text)}
.bubble{display:inline-block;background:var(--accent);color:#1A140C;padding:.32rem .65rem;border-radius:12px 12px 12px 4px;font-size:.84rem;margin-bottom:.5rem;font-weight:650}
.pair{margin:.5rem 0 1rem}
.neck-wrap{background:#101318;border:1px solid var(--border);border-radius:16px;padding:.4rem;overflow:auto}
.chart{display:grid;grid-template-columns:repeat(var(--n),1fr);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin:.7rem 0 .2rem;background:var(--surface)}
.bar{padding:.65rem .7rem;border-right:2px solid var(--border)}
.bar:last-child{border-right:0}
.bar h4{margin:0 0 .45rem;font-family:Fraunces,serif;font-size:1.3rem;text-align:center;color:var(--text)}
.slashes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.slash{text-align:center;padding:.45rem 0 .25rem;border-radius:8px;background:#101318;color:var(--muted);font-size:.8rem}
.slash b{display:block;font-size:1.15rem;color:var(--text)}
.slash.on{background:var(--accent);color:#1A140C}
.slash.on b{color:#1A140C}
.hint{color:var(--muted);font-size:.84rem}
table.grid{border-collapse:collapse;width:100%;font-size:.9rem;margin:.6rem 0}
table.grid th,table.grid td{border:1px solid var(--border);padding:.5rem;text-align:left}
.chromatic{display:flex;flex-wrap:wrap;gap:4px;margin:.5rem 0}
.pitch{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);cursor:pointer}
.pitch.on{background:#1e3d2c}
.jam-board{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.jam-board .card{text-align:center}
.big-count{font:700 3.4rem/1 Fraunces,serif;color:var(--accent);text-align:center;margin:.3rem 0}
details.extra{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:.8rem 1rem;margin:.7rem 0}
details.extra summary{cursor:pointer;font-weight:650;color:var(--text)}
details.extra summary span{display:block;font-weight:400;font-size:.85rem;color:var(--muted)}
dl.words dt{font-weight:650;color:var(--text);margin-top:.9rem}
dl.words dd{margin:.1rem 0 0;color:var(--muted)}
.card-foot{margin-top:1.2rem;color:var(--muted);font-size:.82rem}
.strum-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:.4rem 0}
.tuner-note{font:700 3.4rem/1 Fraunces,serif;color:var(--accent);text-align:center;margin:.2rem 0 .6rem}
.meter{position:relative;height:34px;border-radius:999px;background:#101318;border:1px solid var(--border);margin:0 auto;max-width:420px;display:flex;justify-content:space-between;align-items:center;padding:0 .8rem;font-size:.72rem;color:var(--muted)}
.meter .mid{position:absolute;left:50%;top:4px;bottom:4px;width:2px;background:var(--good);opacity:.6}
.meter .needle{position:absolute;left:50%;top:3px;bottom:3px;width:6px;margin-left:-3px;border-radius:3px;background:var(--accent);transition:left .12s}
.lab .more{display:contents}
.lab .more-btn{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:900px){
  :root{--side:0px}
  .app{grid-template-columns:1fr}
  aside{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--border);padding-bottom:.8rem}
  aside nav{flex-direction:row;overflow:auto}
  aside .nav-sep{display:none}
  aside button.nav{white-space:nowrap}
  .hero{padding-right:110px}
  .pat-btn img{height:140px}
  .lab{left:0}
  .lab .more{display:none}
  .lab.open .more{display:contents}
  .lab .more-btn{display:inline-block}
  .page{padding:1rem 1rem 8rem}
  .strum-grid .slash{font-size:.7rem}
  .jam-board{grid-template-columns:1fr}
  .chart[data-bars="4"]{grid-template-columns:1fr 1fr}
  .chart[data-bars="4"] .bar:nth-child(2){border-right:0}
  .chart[data-bars="4"] .bar:nth-child(-n+2){border-bottom:2px solid var(--border)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside>
  <a class="mark" href="index.html">Murphy's <span>Guitar Lab</span><em>Let's-a fret</em></a>
  <nav id="nav"></nav>
</aside>
<div>
<section class="page on" id="p0"></section>
<section class="page" id="p1"></section>
<section class="page" id="pH"></section>
<section class="page" id="p2"></section>
<section class="page" id="p3"></section>
<section class="page" id="p4"></section>
<section class="page" id="p5"></section>
<section class="page" id="pS"></section>
<section class="page" id="p6"></section>
<section class="page" id="p7"></section>
<section class="page" id="p8"></section>
<section class="page" id="p9"></section>
<section class="page" id="p10"></section>
<section class="page" id="pX"></section>
<section class="page" id="pW"></section>
</div>
</div>
<div class="lab" id="lab">
  <span class="more">
  <span class="label">Speed</span>
  <button class="primary" onclick="setMode('slow')">Slow 60</button>
  <button onclick="setMode('medium')">Medium 70</button>
  <button onclick="setMode('fast')">Faster 80</button>
  <button onclick="nudge(-5)" aria-label="Slower by 5">−5</button>
  <button onclick="nudge(5)" aria-label="Faster by 5">+5</button>
  <span class="hint">BPM <input id="bpm" type="number" value="60" min="40" max="120" style="width:4.2rem;padding:.5rem .6rem"/></span>
  </span>
  <button id="metroBtn" onclick="toggleMetro()">Metronome</button>
  <button onclick="goTuner()">Tuner</button>
  <button onclick="stopAll()">Stop sound</button>
  <button class="more-btn" aria-expanded="false" onclick="this.setAttribute('aria-expanded',document.getElementById('lab').classList.toggle('open'))">Speed ▾</button>
  <span id="countVis" style="font-family:Fraunces,serif;font-size:1.35rem;color:var(--accent);min-width:1.8rem"></span>
  <span class="now" id="now">Slow 60</span>
</div>
<script>
const PAGES=[["p0","Welcome"],["p1","1 · Meet your guitar"],["pH","2 · Holding it"],["p2","3 · Reading tab"],["p3","4 · First chord: Em"],["p4","5 · Changing chords"],["p5","6 · Your first song"],["pS","7 · Strumming up and down"],["p6","8 · First notes"],["p7","9 · The five-note scale"],["p8","10 · Ending on a home note"],["p9","11 · More chords"],["p10","12 · Jam room"],["pX","Extra credit"],["pW","Word list"]];

// Progress ticks are a per-browser convenience; the page works without storage.
function loadDone(){try{return new Set(JSON.parse(localStorage.getItem("mgl-done")||"[]"));}catch(e){return new Set();}}
function saveDone(set){try{localStorage.setItem("mgl-done",JSON.stringify([...set]));}catch(e){}}
let DONE=loadDone();
function markNav(){document.querySelectorAll("aside button.nav").forEach(b=>b.classList.toggle("done",DONE.has(b.dataset.id)));}

function show(id){stopAll(false);stopTuner();try{localStorage.setItem("mgl-last",id);}catch(e){}document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on",p.id===id));document.querySelectorAll("aside button.nav").forEach(b=>b.classList.toggle("on",b.dataset.id===id));window.scrollTo(0,0);}
document.getElementById("nav").innerHTML=PAGES.map(([id,l],i)=>(id==="pX"?`<div class="nav-sep">When you're ready</div>`:"")+`<button class="nav ${i===0?"on":""}" data-id="${id}" onclick="show('${id}')">${l}</button>`).join("");

function pager(a,b){return `<div class="pager">${a?`<button onclick="show('${a}')">← Back</button>`:""}${b?`<button class="primary" onclick="show('${b}')">Next →</button>`:""}</div><p class="card-foot">Every day, 10 minutes: 2 min changing chords · 3 min the scale · 2 min strumming with a chart · 3 min playing a song.</p>`}
function patHero(pose,line,title,body,pid,pocket){
  return `<div class="hero"><div class="copy"><div class="bubble">${line}</div>
  <p class="eyebrow">${title}</p>${body}</div>
  <button class="pat-btn" aria-label="Show Pat's tip" aria-controls="${pid}" onclick="document.getElementById('${pid}').classList.toggle('on')"><img src="${pose==="teach"?"pat-teach.png":"pat-wave.png"}" alt="Pat holding a Les Paul"/></button></div>
  <div class="pocket" id="${pid}"><p><strong>Pat's tip:</strong> ${pocket}</p></div>`;
}
function lesson(o){
  return patHero(o.pose||"teach",(o.bubble||"Click me for a tip")+" →",o.eyebrow,`<h2>${o.title}</h2>${o.intro?`<p>${o.intro}</p>`:""}`,"pk"+o.id,o.tip)+
  (o.learn?`<div class="learn"><strong>In this lesson you'll learn</strong><ul>${o.learn.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:"")+
  o.body+
  (o.goal?`<label class="done-box"><input type="checkbox" data-done="${o.id}"/><span><strong>Tick this when:</strong> ${o.goal}</span></label>`:"")+
  pager(o.prev,o.next);
}
function chartHTML(names,id){
  const n=names.length;
  return `<div class="chart" ${id?`id="${id}"`:""} data-bars="${n}" style="--n:${n}">${names.map((nm,b)=>`<div class="bar"><h4>${nm}</h4><div class="slashes">${[0,1,2,3].map(k=>`<div class="slash" data-i="${b*4+k}"><b>↓</b>${k+1}</div>`).join("")}</div></div>`).join("")}</div>
  <p class="hint">Each box is one bar = 4 beats. Strum down once on each ↓. The gold square is where the band is right now.</p>`;
}
const OPEN_MIDI=[40,45,50,55,59,64], STR=["E","A","D","G","B","e"];
const NOTES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const C_MAJOR=new Set(["C","D","E","F","G","A","B"]);
function svg(n,a){const e=document.createElementNS("http://www.w3.org/2000/svg",n);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));return e;}
const necks={};
function neckPlay(id,spec){
  const host=document.getElementById(id); if(!host) return; host.innerHTML="";
  const fromOpen=spec.lo===0, first=fromOpen?1:spec.lo, last=spec.hi, cols=last-first+1, nutW=fromOpen?10:6, left=62+nutW, top=30, fw=36, sh=22, w=left+fw*cols+16, h=top+sh*6+28;
  const s=svg("svg",{viewBox:`0 0 ${w} ${h}`,width:"100%",height:Math.min(h,230),role:"img","aria-label":"Guitar neck diagram"});
  s.appendChild(svg("rect",{x:0,y:0,width:w,height:h,fill:"#101318",rx:10}));
  s.appendChild(Object.assign(svg("text",{x:8,y:16,fill:"#C9A96E","font-size":11}),{textContent:spec.caption||"nut on the left · thin string on top"}));
  const nutX=62;
  if(fromOpen){s.appendChild(svg("rect",{x:nutX,y:top-2,width:nutW,height:sh*5+4,fill:"#F5F1E8",rx:1}));s.appendChild(Object.assign(svg("text",{x:nutX+nutW/2,y:h-8,fill:"#C9A96E","text-anchor":"middle","font-size":9}),{textContent:"nut"}));}
  else{s.appendChild(svg("line",{x1:nutX+4,y1:top,x2:nutX+4,y2:top+sh*5,stroke:"#A7B0BC","stroke-width":4}));s.appendChild(Object.assign(svg("text",{x:8,y:top+sh*2.5,fill:"#C9A96E","font-size":11}),{textContent:"fret "+first}));}
  for(let i=0;i<=cols;i++){const x=left+i*fw;s.appendChild(svg("line",{x1:x,y1:top,x2:x,y2:top+sh*5,stroke:"#A7B0BC"}));if(i<cols)s.appendChild(Object.assign(svg("text",{x:x+fw/2,y:h-8,fill:(first+i===12)?"#C9A96E":"#8b93a0","text-anchor":"middle","font-size":10}),{textContent:first+i}));}
  for(let vis=0;vis<6;vis++){const y=top+vis*sh;s.appendChild(svg("line",{x1:fromOpen?nutX:left,y1:y,x2:left+fw*cols,y2:y,stroke:"#d8c9b0"}));s.appendChild(Object.assign(svg("text",{x:4,y:y+4,fill:"#C9A96E","font-size":10}),{textContent:STR[5-vis]}));}
  function xy(str,fret){const y=top+(5-str)*sh;if(fret===0)return{x:nutX+nutW/2,y};return{x:left+(fret-first+.5)*fw,y};}
  const dots={};
  (spec.ghosts||[]).forEach(g=>{const p=xy(g.s,g.f);s.appendChild(svg("circle",{cx:p.x,cy:p.y,r:9,fill:g.root?"#8a6a32":"#2d6a44",opacity:.55}));s.appendChild(Object.assign(svg("text",{x:p.x,y:p.y+3,fill:"#F5F1E8","text-anchor":"middle","font-size":9}),{textContent:g.lab||""}));dots[g.s+"-"+g.f]=p;});
  const hot=svg("circle",{cx:-40,cy:-40,r:12,fill:"#C9A96E",stroke:"#F5F1E8","stroke-width":2});
  const nxt=svg("circle",{cx:-40,cy:-40,r:13,fill:"none",stroke:"#C9A96E","stroke-width":2,"stroke-dasharray":"3 3"});
  s.appendChild(nxt);s.appendChild(hot);host.appendChild(s);
  necks[id]={dots,hot,nxt,xy,light(str,fret,next){const p=dots[str+"-"+fret]||xy(str,fret);hot.setAttribute("cx",p.x);hot.setAttribute("cy",p.y);if(next){const q=dots[next.s+"-"+next.f]||xy(next.s,next.f);nxt.setAttribute("cx",q.x);nxt.setAttribute("cy",q.y);}else{nxt.setAttribute("cx",-40);nxt.setAttribute("cy",-40);}}};
}
function pair(id,tab){return `<div class="pair"><div class="neck-wrap" id="${id}"></div><pre class="tab">${tab}</pre></div>`;}
const TAB_BOX=`e|--------------5--8
B|-----------5--8---
G|--------5--7------
D|-----5--7---------
A|--5--7------------
E|--5--8------------`;
const TAB_DEGA=`e|----------------
B|----------------
G|----------------
D|--------5--7----
A|--5--7----------
E|----------------`;
const TAB_EM=`e|--0--
B|--0--
G|--0--
D|--2--
A|--2--
E|--0--`;
const BOX_GHOST=[{s:0,f:5,lab:"A",root:1},{s:0,f:8,lab:"C"},{s:1,f:5,lab:"D"},{s:1,f:7,lab:"E"},{s:2,f:5,lab:"G"},{s:2,f:7,lab:"A",root:1},{s:3,f:5,lab:"C"},{s:3,f:7,lab:"D"},{s:4,f:5,lab:"E"},{s:4,f:8,lab:"G"},{s:5,f:5,lab:"A",root:1},{s:5,f:8,lab:"C"}];

document.getElementById("p0").innerHTML=patHero("wave","Hi, I'm Pat. Click me any time for a tip →","Welcome",
`<h1>Let's-a fret.</h1><p>This lab takes you from "I just got a guitar" to playing along with a band — one small step per lesson.</p>`,"pk0",
`nobody sounds good in week one. Ten minutes every day beats an hour on Sunday.`)+
`<h3>How to use the lab</h3>
<ol class="steps">
<li><strong>Go in order.</strong> The lessons are on the left. Each one builds on the last.</li>
<li><strong>Turn your sound on.</strong> Gold and green buttons play sound so you can hear what it should sound like.</li>
<li><strong>Use the bar at the bottom</strong> to set the speed and turn on a metronome (a steady click to play along with). Always start on <strong>Slow</strong>.</li>
<li><strong>Tick the green box</strong> at the end of a lesson when you can do it. A ✓ appears in the menu.</li>
<li><strong>Stuck on a word?</strong> Check the <a href="#" onclick="show('pW');return false" style="color:var(--accent)">Word list</a>.</li>
</ol>
<div class="card"><p class="eyebrow">Your 10 minutes a day</p>
<p><strong>2 min</strong> changing chords · <strong>3 min</strong> the scale · <strong>2 min</strong> strumming with a chart · <strong>3 min</strong> playing a song. Same plan every day — just slot in whatever lesson you're on.</p></div>
<p class="hint">You'll need a guitar (acoustic or electric) that's in tune. A free tuner app on your phone is the easiest way.</p>
<div class="row"><button class="primary" onclick="show('p1')">Start lesson 1 →</button><a class="hint" href="index.html">← Back to the home page</a></div>`;

document.getElementById("p1").innerHTML=lesson({id:"p1",eyebrow:"Lesson 1",title:"Meet your guitar",prev:"p0",next:"pH",
tip:`if a note buzzes, slide your finger closer to the metal fret bar. You don't need to press as hard as you think.`,
learn:["What the six strings are called","What a fret is and how frets are numbered","Which finger is which"],
body:`<h3>The six strings</h3>
<p>From the <strong>thickest</strong> string (closest to your face when you hold the guitar) to the <strong>thinnest</strong>, the strings are <strong>E A D G B E</strong>.</p>
<p>Memory trick: <em>Eddie Ate Dynamite, Good Bye Eddie.</em> The thick one is called <strong>low E</strong> and the thin one <strong>high e</strong>. Tap a string to hear it:</p>
<div class="row" id="openStrings"></div>
<h3>Tune up first</h3>
<p>An out-of-tune guitar makes even perfect playing sound wrong, so tune every time you pick it up. Press Start, then play one string at a time and let it ring.</p>
<div class="card" id="tunerCard">
  <p class="hint center" id="tunerString">—</p>
  <div class="tuner-note" id="tunerNote">♪</div>
  <div class="meter" aria-hidden="true"><span class="flat">too low</span><span class="mid"></span><span class="sharp">too high</span><div class="needle" id="tunerNeedle"></div></div>
  <p class="center" id="tunerMsg">Press Start and play one string.</p>
  <div class="row center"><button class="primary" id="tunerBtn" onclick="toggleTuner()">Start tuner</button></div>
</div>
<ul>
<li><strong>Too low</strong> → turn the peg to <strong>tighten</strong> the string. The note goes up.</li>
<li><strong>Too high</strong> → <strong>loosen</strong> it. Tip: go a little below, then tighten up to the note — it stays in tune better.</li>
<li>Turn slowly. A small turn makes a big change.</li>
</ul>
<p class="hint">The tuner uses your microphone. Your browser will ask first. Nothing is recorded or sent anywhere, and it only listens while it's on.</p>
<h3>Frets</h3>
<p>The thin metal bars across the neck are <strong>frets</strong>. The ridge at the end of the neck, by the tuning pegs, is the <strong>nut</strong>.</p>
<p><strong>"Fret 1"</strong> means the gap between the nut and the first metal bar. Fret 2 is the next gap, and so on. Press <strong>just behind</strong> the metal bar (on the nut side), not on top of it.</p>
<div class="pair"><div class="neck-wrap" id="nkIntro"></div></div>
<p class="plain"><strong>Important:</strong> in every neck picture in this lab, the <strong>thin string is on top</strong> and the nut is on the left. It's what you'd see if you tipped your head and looked down at the guitar while playing.</p>
<h3>Finger numbers</h3>
<p>The fingers on the hand that presses the strings are numbered: <strong>1</strong> = index, <strong>2</strong> = middle, <strong>3</strong> = ring, <strong>4</strong> = pinky. Your thumb rests behind the neck.</p>
<p class="plain"><strong>Left-handed?</strong> Everything here works for you too. Tab and the neck pictures read exactly the same. Chord diagrams will look like a mirror image of your guitar (your thick string is on the right when the guitar faces you), but the strings, frets and finger numbers don't change.</p>`,
goal:"your guitar is in tune, and you can name the six strings from thick to thin."});

document.getElementById("pH").innerHTML=lesson({id:"pH",eyebrow:"Lesson 2",title:"Holding the guitar and the pick",prev:"p1",next:"p2",
bubble:"Relaxed beats strong",
intro:"Good habits now save you sore wrists and bad sound later. It only takes five minutes.",
tip:`if your hand gets tense, stop, shake it out, and start again. A relaxed hand plays better and lasts longer.`,
learn:["How to sit with the guitar","Where your thumb goes","How to hold a pick and strum"],
body:`<h3>Sitting</h3>
<ol class="steps">
<li>Sit on a chair without arms, back straight.</li>
<li>Rest the dip in the guitar's body on your <strong>right leg</strong>. The neck points to your left, tilted slightly up.</li>
<li>Keep the guitar <strong>upright</strong> against your belly. Don't tip the top toward you to see the strings — lean your head a little instead.</li>
<li>Rest your right forearm on the top edge of the body so your hand hangs over the strings.</li>
</ol>
<h3>The hand on the neck</h3>
<ul>
<li>Your <strong>thumb</strong> goes behind the neck, roughly behind your middle finger.</li>
<li>Squeeze lightly, like holding a sandwich — not like gripping a baseball bat.</li>
<li>Leave a small gap between your palm and the neck so your fingers can curve.</li>
</ul>
<h3>The pick</h3>
<ul>
<li>Pinch it between the <strong>pad of your thumb</strong> and the <strong>side of your index finger</strong>.</li>
<li>Only the tip should poke out — about the width of a pea.</li>
<li>A thin or medium pick (around 0.5–0.7 mm) is easiest for strumming.</li>
<li>No pick? Brush down with the side of your thumb. That works fine too.</li>
</ul>
<h3>The strumming motion</h3>
<p>Move from your <strong>wrist and forearm</strong>, like shaking water off your hand — not from your shoulder. Strum over the sound hole (acoustic) or between the pickups (electric). A <strong>downstroke</strong> goes from the thick strings to the thin ones.</p>
<button class="primary" onclick="playChordRing(OPEN_MIDI)">Hear an open strum</button>
<p class="plain"><strong>Left-handed?</strong> Mirror everything: guitar on your left leg, neck pointing right, pick in your left hand. Most lefties use a left-handed guitar, but some learn on a regular one — either is fine.</p>`,
goal:"you can sit with the guitar, hold the pick, and strum all six strings in one smooth down-swing."});

document.getElementById("p2").innerHTML=lesson({id:"p2",eyebrow:"Lesson 3",title:"Reading tab",prev:"pH",next:"p3",
intro:"Tab is the easy way to write guitar music. No reading music needed.",
tip:`say the string and fret out loud as you play: "A string, fret 2". It sticks much faster.`,
learn:["How to read guitar tab","What 0 means","How tab shows a chord"],
body:`<p>Tab is a picture of the strings. <strong>Six lines = six strings</strong>, with the <strong>thin string on top</strong> (same as the neck pictures).</p>
<p>A number on a line tells you <strong>which fret to press</strong> on that string. <code>0</code> means play the string without pressing anything (called an <strong>open string</strong>). Read left to right, like a sentence.</p>
${pair("nkTab",`e|------------
B|------------
G|------------
D|------------
A|--0--2--3---
E|------------`)}
<ol class="steps">
<li>The numbers are on the <strong>A</strong> line (second from the bottom), so you play the A string.</li>
<li>Play it open (<code>0</code>), then press fret 2, then fret 3.</li>
<li>Use finger 2 for fret 2 and finger 3 for fret 3.</li>
</ol>
<button class="primary" onclick="playPath('nkTab',[{s:1,f:0,midi:45,l:'A string, open'},{s:1,f:2,midi:47,l:'A string, fret 2'},{s:1,f:3,midi:48,l:'A string, fret 3'}])">Hear it</button>
<h3>When numbers stack up</h3>
<p>Numbers written straight above each other are played <strong>at the same time</strong>. That's a <strong>chord</strong>. This one is Em — your first chord, coming next lesson:</p>
<pre class="tab">${TAB_EM}</pre>`,
goal:"you can look at a tab and say which string and fret each number means."});

document.getElementById("p3").innerHTML=lesson({id:"p3",eyebrow:"Lesson 4",title:"Your first chord: Em",prev:"p2",next:"p4",
bubble:"Arch those fingers",
intro:"Em (say \"E minor\") uses just two fingers and sounds great.",
tip:`if a string sounds dead, a finger is probably leaning on it. Curl your fingers so you press with the very tips.`,
learn:["How to read a chord diagram","How to play Em","How to strum in time"],
body:`<h3>How to read a chord diagram</h3>
<p>Chord diagrams show the guitar <strong>standing up, facing you</strong>. (Yes, that's a different view from tab. Everyone draws them this way, so it's worth getting used to.)</p>
<ul>
<li><strong>Up-and-down lines</strong> are the strings. The thick low E is on the <strong>left</strong>.</li>
<li>The <strong>thick bar on top</strong> is the nut. The lines going across are the frets.</li>
<li>A <strong>gold dot</strong> means put a finger there. The number inside tells you which finger.</li>
<li><strong>○</strong> means play that string open. <strong>×</strong> means don't play that string.</li>
</ul>
<div class="row" id="emCard"></div>
<h3>Try it</h3>
<ol class="steps">
<li>Put finger 2 on the A string, fret 2. Put finger 3 on the D string, fret 2.</li>
<li>Press with your fingertips, curved like a bridge, so you don't touch the other strings.</li>
<li>Pick each string one at a time, thick to thin. Each one should ring clearly. If one buzzes or thuds, adjust that finger.</li>
<li>Now strum down across all six strings. Press <strong>Hear</strong> to compare.</li>
</ol>
<h3>Strum along</h3>
<p>Press play. After 4 count-in clicks, strum down once on every beat: <strong>1, 2, 3, 4</strong>.</p>
${chartHTML(["Em","Em"])}
<button class="good" onclick="startBand('Em')">▶ Strum Em with the band</button>`,
goal:"you can strum Em four times in a row with every string ringing."});

document.getElementById("p4").innerHTML=lesson({id:"p4",eyebrow:"Lesson 5",title:"Changing chords",prev:"p3",next:"p5",
bubble:"This is the big one",
intro:"Switching between chords quickly is the skill that turns chords into songs. It's also where most beginners give up — so we practise it a little every day.",

learn:["A warm-up chord: Asus2","Your second real chord: G","The one-minute challenge"],
body:`<h3>Warm-up: Em → Asus2</h3>
<p>Hold Em, then move both fingers <strong>one string thinner</strong> (toward the floor), staying on fret 2. That's Asus2. Skip the low E string when you strum it.</p>
<div class="row" id="twoChords"></div>

document.getElementById("p5").innerHTML=lesson({id:"p5",pose:"wave",eyebrow:"Lesson 6",title:"Your first song",prev:"p4",next:"pS",
bubble:"Beat 1 is king",
intro:"Two chords and a steady beat. That's a song.",
tip:`if you're late getting to the next chord, skip the 4th strum and use that beat to move your fingers. Landing on beat 1 matters more than playing every strum.`,
learn:["How to read a chord chart","How to change chords in time with a band"],
body:`<p>A <strong>chord chart</strong> tells you what to play and for how long:</p>
<ul>
<li>Each box is one <strong>bar</strong>. A bar has 4 beats — count "1, 2, 3, 4".</li>
<li>Each ↓ is one down-strum.</li>

<p>Why these two? <strong>G, C, D and Em</strong> are the four chords behind a huge number of pop, folk and country songs. You now know two of them, and you'll pick up C and D in lesson 11.</p>`,

document.getElementById("pS").innerHTML=lesson({id:"pS",pose:"wave",eyebrow:"Lesson 7",title:"Strumming up and down",prev:"p5",next:"p6",
bubble:"Keep that hand swinging",
intro:"Only downstrokes gets boring fast. Here's how strummers get that rolling, bouncing sound.",
tip:`upstrokes only need to catch the 3 or 4 thinnest strings. Let the pick brush them lightly on the way back up.`,
learn:["How to count \"1 and 2 and\"","The hand swing that keeps you in time","A strum pattern used in countless songs"],
body:`<h3>Count in halves</h3>
<p>Between every beat there's an "and". Count out loud: <strong>1 & 2 & 3 & 4 &</strong>. Strum <strong>down on the numbers</strong> and <strong>up on the "&"s</strong>.</p>
<h3>The secret: never stop swinging</h3>
<p>Your hand moves down and up all the time, like a pendulum. When the pattern has a gap, keep swinging but <strong>miss the strings</strong>. Don't stop your hand. That's what keeps you in time.</p>
<div class="card">
  <h3 class="center" id="strumChord">Em</h3>
  <div class="strum-grid" id="strumChart"></div>
  <p class="hint center">↓ = strum down · ↑ = strum up · <strong>·</strong> = swing, but miss the strings</p>
</div>
<ol class="steps">
<li>Pick a pattern below. Listen to it go around once.</li>
<li>Join in on <strong>Em</strong>, then <strong>G</strong> (one bar each). The gold square shows where you are.</li>
<li>Start on <strong>Slow 60</strong>. There are twice as many strums as before, so it feels faster than it is.</li>
</ol>
<div class="row">
<button class="good" onclick="startStrum('downs')">▶ 1. Downs only</button>
<button class="good" onclick="startStrum('du')">▶ 2. Down-up all the way</button>
<button class="good" onclick="startStrum('classic')">▶ 3. The classic pattern</button>
</div>
<p class="plain">Pattern 3 (<strong>down, down-up, up-down-up</strong>) is the strum behind a huge number of pop, folk and campfire songs. Once you have it, you can strum almost anything.</p>`,
goal:"you can play the classic pattern on Em – G at Slow 60 without stopping your hand."});

document.getElementById("p6").innerHTML=lesson({id:"p6",eyebrow:"Lesson 8",title:"Your first notes",prev:"pS",next:"p7",

body:`<p>Here are four notes. They're on the A and D strings, at frets 5 and 7:</p>
${pair("nkDega",TAB_DEGA)}

document.getElementById("p7").innerHTML=lesson({id:"p7",eyebrow:"Lesson 9",title:"The five-note scale",prev:"p6",next:"p8",
bubble:"Same hand spot as before",
intro:"Your four notes were part of something bigger: the most-used scale in rock, blues and pop solos.",
tip:`play it slowly enough that you never stop. Smooth and slow beats fast and choppy.`,
learn:["The A minor pentatonic scale (\"pentatonic\" just means five notes)","Which finger plays which note"],
body:`<p>A <strong>scale</strong> is a set of notes that sound good together. This one uses just five: <strong>A, C, D, E and G</strong>, repeated across all six strings — two notes on each string.</p>
${pair("nkPent",TAB_BOX)}

<ol class="steps">

<li>Notes on fret 7 → finger 3. Notes on fret 8 → finger 4 (your pinky).</li>
<li>Start on the thick string and play each note in order to the thin string, just like the tab.</li>
<li>Then play it back down.</li>
</ol>
<div class="row"><button class="primary" onclick="playCurrentPent(false)">Hear it going up</button><button class="primary" onclick="playCurrentPent(true)">Hear it going down</button></div>

document.getElementById("p8").innerHTML=lesson({id:"p8",eyebrow:"Lesson 10",title:"Ending on a home note",prev:"p7",next:"p9",
bubble:"Finish on a chord note",
intro:"All five notes sound fine over this band. But at the end of a phrase, some sound finished and some sound like a question.",
tip:`hum your line before you play it. If you can sing it, it'll sound like music.`,
learn:["Home notes and passing notes","How to make up your own short tunes"],
body:`<table class="grid">
<tr><th>When the band plays…</th><th>Home notes<br/><span class="hint">sound finished</span></th><th>Passing notes<br/><span class="hint">fine in the middle</span></th></tr>
<tr><td>Am</td><td><strong>A C E</strong></td><td>D G</td></tr>
<tr><td>C</td><td><strong>C E G</strong></td><td>A D</td></tr>
</table>
<p><strong>Why?</strong> Every chord is built from three notes. Am is A + C + E. C is C + E + G. When you stop on one of the chord's own notes, it fits like a puzzle piece.</p>
${pair("nkBox",TAB_BOX)}
${chartHTML(["Am","C"])}
<h3>Try three ways</h3>
<ol class="steps">

</ol>
<div class="row">
<button class="primary" onclick="startCross('beginner')">▶ Follow Pat</button>
<button class="good" onclick="startCross('player')">▶ Follow Pat, with jumps</button>

</div>`,

document.getElementById("p9").innerHTML=lesson({id:"p9",eyebrow:"Lesson 11",title:"More chords, more songs",prev:"p8",next:"p10",
bubble:"One new chord a week",
intro:"These nine chords are behind thousands of songs. Don't try to learn them all at once — one new chord a week is a great pace.",
tip:`use the one-minute challenge from lesson 5 for every new chord. Pair it with a chord you already know.`,
learn:["The nine open chords","A four-chord progression used in countless pop songs"],
body:`<p>They're called <strong>open chords</strong> because they use open strings.</p>
<h3>Major chords <span class="hint">— bright, happy sound</span></h3>
<div class="row" id="cowboyMajors"></div>
<h3>Minor chords <span class="hint">— darker, sadder sound</span></h3>
<div class="row" id="cowboyMinors"></div>
<p class="plain"><strong>F is the hardest chord here.</strong> This is the small, easier version: finger 1 lies flat across the two thinnest strings. Give it a few weeks — everyone struggles with F.</p>
<h3>Four chords, a hundred songs</h3>
<p>C – Am – F – G is one of the most-used chord patterns in pop music. One bar each, then repeat. <em>Stand By Me</em>, <em>Every Breath You Take</em> and <em>Earth Angel</em> are all built on this same pattern (just started from a different note).</p>
${chartHTML(["C","Am","F","G"])}
<button class="good" onclick="startBand('C Am F G')">▶ Play C – Am – F – G</button>`,
goal:"you can play C – Am – F – G with the band, even if F is a bit messy."});

document.getElementById("p10").innerHTML=lesson({id:"p10",pose:"wave",eyebrow:"Lesson 12",title:"Jam room",prev:"p9",next:"pX",

<button class="good" onclick="startJam('C Am F G')">▶ C – Am – F – G</button>

</div>

document.getElementById("pX").innerHTML=patHero("teach","Optional — no rush →","Extra credit",
`<h2>When you're ready for more</h2><p>None of this is needed to play songs. Come back once lessons 1–12 feel comfortable.</p>`,"pkX",
`if any of this feels confusing, skip it and go play songs. It'll make more sense later.`)+
`<details class="extra"><summary>Why so much of this is in the key of C<span>The 12 notes of music, and why C is the easy one</span></summary>
<p>Music uses just <strong>12 notes</strong>, then they repeat higher up. Tap them to hear. The green ones are the <strong>C major scale</strong> — seven notes with no sharps (#). They're the white keys on a piano.</p>
<div class="chromatic" id="chromatic"></div>
<p>Your five-note scale (A C D E G) is just five of those seven notes. That's why it fits everything in this lab.</p>
<p>The circle below is the <strong>circle of fifths</strong>. Keys that sit next to each other share almost all their notes. You don't need it yet — it's here for later.</p>
<div class="card" id="cof"></div>
</details>
<details class="extra"><summary>Training your ear<span>Sing first, then find it on the guitar</span></summary>
<p>Press play, listen to the three notes (C, D, G), and sing them back. Then try to find them on your guitar. Getting it wrong and hunting for it is the practice.</p>
<button class="primary" onclick="playPath('nkEar',[{s:0,f:8,midi:48,l:'C'},{s:2,f:0,midi:50,l:'D'},{s:3,f:0,midi:55,l:'G'}])">Play C – D – G</button>
${pair("nkEar",`G|-----------0--
D|------0-------
E|--8-----------`)}
</details>
<details class="extra"><summary>The same note in two places<span>Every note lives in more than one spot on the neck</span></summary>
<p>Low E string, fret 8 is a <strong>C</strong>. So is A string, fret 3. Same exact note, two places. Moving to the next thinner string is like jumping 5 frets (4 frets onto the B string).</p>
<div class="row"><button class="primary" onclick="setNPS(0)">C on low E, fret 8</button><button class="primary" onclick="setNPS(1)">C on A, fret 3</button></div>
<p class="hint" id="npsWhere"></p>
<div class="pair"><div class="neck-wrap" id="nkNps"></div><pre class="tab" id="nkNpsTab"></pre></div>
<div class="row"><button onclick="playCurrentNPS()">Play this pattern</button><button onclick="playUnisonC()">Hear both C's</button></div>
</details>
<details class="extra"><summary>Three notes on one string<span>A faster way to play scales — later</span></summary>
<p>Some players put three notes on every string instead of two. It's great for playing fast, but harder to stretch. Try these patterns on the B string with fingers 1, 3 and 4.</p>
<div class="row" id="cellRow"></div>
${pair("nkB",`B|-1-3-5-6-8-10-12-13-`)}
<button class="primary" onclick="playBWalk()">Play the whole B string</button>
</details>
<details class="extra"><summary>How chords are built<span>Why C + E + G makes a C chord</span></summary>
<p>Go around this circle and take every other note of the scale, starting on C: <strong>C, E, G</strong>. That's a C chord. Start on A instead: <strong>A, C, E</strong> = Am.</p>
<p>A <strong>power chord</strong> (the rock sound) uses only two of them: the first and the fifth, like C + G.</p>
<div id="cot"></div>
<button onclick="toggleDrone()">C drone on / off</button> <span class="hint">A steady C note to play the scale over.</span>
</details>
<details class="extra"><summary>Moving to the key of G<span>Same shapes, new starting note</span></summary>
<p>Everything you've learned can slide to a new starting note. That's what "changing key" means.</p>
<p>Every major scale follows the same pattern of steps: <strong>whole, whole, half, whole, whole, whole, half</strong>. (A half step is one fret. A whole step is two.) Start that pattern on C and you only land on plain notes. Start it on G and the 7th note has to be <strong>F#</strong> to keep the pattern:</p>
<p class="center"><strong>G A B C D E F#</strong></p>
<p>The chords in the Jam room's G – C – D – G band all come from these notes.</p>
<h3>Your five-note shape, moved to the open strings</h3>
<p>Slide the scale shape from lesson 9 down to the open strings and it becomes <strong>E minor pentatonic</strong>: E G A B D. Those notes all belong to the key of G, so this shape fits the G – C – D – G band. The darker dots are G.</p>
<div class="pair"><div class="neck-wrap" id="nkEpent"></div><pre class="tab" id="nkEpentTab"></pre></div>
<div class="row"><button class="primary" onclick="playEpent()">Hear the shape</button><button class="good" onclick="startBand('G C D G')">▶ Play it over G – C – D – G</button></div>
</details>`+pager("p10","pW");

<dl class="words">
<dt>Bar</dt><dd>A chunk of music, usually 4 beats long. In a chord chart, one box.</dd>
<dt>Beat</dt><dd>The steady pulse you tap your foot to.</dd>
<dt>BPM</dt><dd>Beats per minute — how fast the music goes. 60 BPM is one beat every second.</dd>
<dt>Buzz</dt><dd>A rattly sound when a finger isn't pressing cleanly. Move closer to the fret bar.</dd>
<dt>Chord</dt><dd>Several notes played at the same time.</dd>
<dt>Chord chart</dt><dd>A list of boxes (bars) showing which chord to play and for how long.</dd>
<dt>Chord diagram</dt><dd>A picture of the guitar standing up, with dots showing where your fingers go.</dd>
<dt>Count-in</dt><dd>The 4 clicks before the band starts, so you know when to come in.</dd>
<dt>Fret</dt><dd>The metal bars across the neck — and the gaps between them. "Fret 3" = the third gap from the nut.</dd>
<dt>Home note</dt><dd>A note that belongs to the chord being played. Ending on one sounds finished.</dd>
<dt>Major / minor</dt><dd>Two flavours of chord. Major sounds bright; minor sounds darker. "Em" means E minor.</dd>
<dt>Metronome</dt><dd>A steady click to keep you in time.</dd>
<dt>Nut</dt><dd>The ridge at the end of the neck, near the tuning pegs.</dd>
<dt>Open string</dt><dd>A string played without pressing any fret. Written as 0 in tab.</dd>
<dt>Passing note</dt><dd>A note that sounds fine in the middle of a tune but unsettled at the end.</dd>
<dt>Pentatonic scale</dt><dd>A five-note scale. Easy to play and very hard to make sound bad.</dd>
<dt>Scale</dt><dd>A set of notes that sound good together.</dd>
<dt>Strum</dt><dd>Brushing across several strings at once. A downstroke goes from the thick strings toward the thin ones.</dd>

// Plucked-string sound (Karplus-Strong): a burst of noise fed through a short, slowly
// damped delay line rings like a real string. One buffer per pitch, built once.
const PLUCKS={};
function pluckBuffer(midi){
  if(PLUCKS[midi]) return PLUCKS[midi];
  const a=ctx(),sr=a.sampleRate,f=midiToFreq(midi),N=Math.max(2,Math.round(sr/f)),len=Math.floor(sr*2.6),d=new Float32Array(len);
  const T=Math.max(1.2,3.2-(midi-40)*.05), rho=Math.pow(.001,1/(f*T));
  let prev=0;for(let i=0;i<N;i++){const r=Math.random()*2-1;d[i]=(r+prev)*.5;prev=r;}
  for(let i=N;i<len;i++) d[i]=(d[i-N]+d[i-N+1])*.5*rho;
  const buf=a.createBuffer(1,len,sr);buf.copyToChannel(d,0);
  return PLUCKS[midi]=buf;
}
function pluck(midi,dur,gain=.2,when=0){
  const a=ctx(),src=a.createBufferSource(),lp=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime+when,end=Math.min(dur,2.5);
  src.buffer=pluckBuffer(midi);lp.type="lowpass";lp.frequency.value=3800;
  g.gain.setValueAtTime(gain,t);g.gain.setValueAtTime(gain,t+Math.max(.05,end-.08));g.gain.exponentialRampToValueAtTime(.0001,t+end);
  src.connect(lp);lp.connect(g);g.connect(a.destination);src.start(t);src.stop(t+end+.02);

function addChange(){if(!drillOn)return;changeCount++;document.getElementById("changeCount").textContent=changeCount;}
function startChanges(){changeCount=0;document.getElementById("changeCount").textContent="0";document.getElementById("drillMsg").textContent="get ready… start on Em";
countIn(()=>{let t=60;drillOn=true;document.getElementById("countVis").textContent="";document.getElementById("drillMsg").textContent="Go! Em ↔ G — press +1 (or space) for each clean change";setNow("60 seconds left");
changeTimer=setInterval(()=>{t--;setNow(t+" seconds left");if(t<=0){const n=changeCount;stopAll(false);clickMetro();const best=loadBest();if(n>best){try{localStorage.setItem("mgl-best-changes",n);}catch(e){}}
document.getElementById("drillMsg").textContent=n>best&&best?`Time! New best: ${n} clean changes 🎉`:`Time! ${n} clean changes`;setNow("minute done");showBest();}},1000);});}
document.addEventListener("keydown",e=>{if(drillOn&&e.code==="Space"){e.preventDefault();addChange();}});
showBest();

function toggleMetro(){metroOn=!metroOn;document.getElementById("metroBtn").textContent=metroOn?"Metronome: on":"Metronome";if(metroTimer)clearInterval(metroTimer);if(metroOn){ctx();clickMetro();metroTimer=setInterval(clickMetro,bpmMs());}}
function toggleDrone(){const a=ctx();if(droneOn){droneOsc.stop();droneOn=false;return;}droneOsc=a.createOscillator();const g=a.createGain();droneOsc.frequency.value=midiToFreq(48);g.gain.value=.04;droneOsc.connect(g);g.connect(a.destination);droneOsc.start();droneOn=true;}
function stopAll(reset=true){metroOn=false;drillOn=false;document.getElementById("metroBtn").textContent="Metronome";if(metroTimer)clearInterval(metroTimer);if(progTimer)clearTimeout(progTimer);if(changeTimer)clearInterval(changeTimer);stopPlay();document.getElementById("countVis").textContent="";document.querySelectorAll(".slash.on").forEach(s=>s.classList.remove("on"));if(droneOn){try{droneOsc.stop();}catch(e){}droneOn=false;}if(reset)setNow("stopped");}

const PROG={"Em":["Em"],"Am C":["Am","C"],"Em G Em G":["Em","G","Em","G"],"G C D G":["G","C","D","G"],"C Am F G":["C","Am","F","G"]};
function paintJam(a,b){const n=document.getElementById("jamNow"),x=document.getElementById("jamNext");if(!n||!n.closest(".page.on"))return;n.querySelector("h3").textContent=CHORDS[a].name;x.querySelector("h3").textContent=CHORDS[b].name;n.querySelector(".dia").replaceChildren(drawChord(CHORDS[a]));x.querySelector(".dia").replaceChildren(drawChord(CHORDS[b]));}
function startJam(name){document.querySelectorAll("#jamChart h4").forEach((h,i)=>h.textContent=PROG[name][i]);startBand(name);}
function startBand(name){const seq=PROG[name];countIn(()=>{let bar=0,beat=0;(function step(){const key=seq[bar%seq.length],nxt=seq[(bar+1)%seq.length],ch=CHORDS[key];lightBeat(bar,beat);if(beat===0){paintJam(key,nxt);kick();bass(ch.bass,.32);playChordRing(ch.midi);setNow("Play "+ch.name);}else if(beat===1){hat();bass(ch.bass+12,.12);}else if(beat===2){snare();hat();bass(ch.bass+7,.16);}else hat();beat++;if(beat>3){beat=0;bar++;}progTimer=setTimeout(step,bpmMs());})();});}

// Strum patterns: 8 slots per bar (1 & 2 & 3 & 4 &). D = down, U = up, - = swing and miss.
const STRUMS={downs:"D-D-D-D-",du:"DUDUDUDU",classic:"D-DU-UDU"};
function paintStrum(p){document.getElementById("strumChart").innerHTML=[...p].map((c,i)=>`<div class="slash" data-s="${i}"><b>${c==="D"?"↓":c==="U"?"↑":"·"}</b>${i%2?"&":i/2+1}</div>`).join("");}
paintStrum(STRUMS.classic);
function startStrum(name){const p=STRUMS[name];paintStrum(p);countIn(()=>{let i=0;(function step(){const slot=i%8,key=["Em","G"][Math.floor(i/8)%2],ch=CHORDS[key];
document.getElementById("strumChord").textContent=key;document.querySelectorAll("#strumChart .slash").forEach(s=>s.classList.toggle("on",+s.dataset.s===slot));
if(slot===0){kick();bass(ch.bass,.3);}else if(slot===4)kick();if(slot===2||slot===6)snare();hat();
if(p[slot]==="D")playChordRing(ch.midi,false,.11);else if(p[slot]==="U")playChordRing(ch.midi.slice(-4),true,.075);
setNow(key+" · "+(slot%2?"&":slot/2+1));i++;progTimer=setTimeout(step,bpmMs()/2);})();});}

// Tuner: microphone → autocorrelation pitch estimate → nearest open string.
let tuner=null;
function detectPitch(buf,sr){
  let rms=0;for(const v of buf)rms+=v*v;if(Math.sqrt(rms/buf.length)<.01)return -1;
  const n=buf.length,c=new Float32Array(n);
  // Normalized autocorrelation (McLeod NSDF): 1 = perfect match at that lag.
  for(let lag=0;lag<n/2;lag++){let s=0,m=0;for(let i=0;i<n/2;i++){const x=buf[i],y=buf[i+lag];s+=x*y;m+=x*x+y*y;}c[lag]=m?2*s/m:0;}
  // Skip past the lag-0 hump, then take the first peak near the tallest one (avoids octave errors).
  let d=1;while(d<n/2-1&&c[d]>c[0]*.3)d++;
  let top=-Infinity;for(let i=d;i<n/2;i++)top=Math.max(top,c[i]);
  if(top<c[0]*.5)return -1;
  let best=-1;for(let i=d+1;i<n/2-1;i++)if(c[i]>=top*.9&&c[i]>=c[i-1]&&c[i]>=c[i+1]){best=i;break;}
  if(best<1)return -1;
  const x1=c[best-1],x2=c[best],x3=c[best+1],a=(x1+x3-2*x2)/2,b=(x3-x1)/2;
  return sr/(a?best-b/(2*a):best);
}
function tunerFrame(){
  if(!tuner)return;
  tuner.an.getFloatTimeDomainData(tuner.buf);
  const f=detectPitch(tuner.buf,tuner.sr);
  if(f>60&&f<1000){
    tuner.hist.push(f);if(tuner.hist.length>5)tuner.hist.shift();
    const med=[...tuner.hist].sort((a,b)=>a-b)[tuner.hist.length>>1];
    let s=0,cents=Infinity;OPEN_MIDI.forEach((m,i)=>{const c=1200*Math.log2(med/midiToFreq(m));if(Math.abs(c)<Math.abs(cents)){cents=c;s=i;}});
    const ok=Math.abs(cents)<5,cl=Math.max(-50,Math.min(50,cents));
    document.getElementById("tunerString").textContent=`String ${6-s} · ${s===0?"low E":s===5?"high e":STR[s]}`;
    document.getElementById("tunerNote").textContent=STR[s].toUpperCase();
    document.getElementById("tunerNote").style.color=ok?"var(--good)":"var(--accent)";
    const nd=document.getElementById("tunerNeedle");nd.style.left=(50+cl)+"%";nd.style.background=ok?"var(--good)":"var(--accent)";
    document.getElementById("tunerMsg").textContent=ok?"In tune ✓":Math.abs(cents)>50?(cents<0?"Way too low — tighten the string":"Way too high — loosen the string"):(cents<0?"A bit low — tighten slowly":"A bit high — loosen slowly");
  }
}
async function toggleTuner(){
  if(tuner){stopTuner();return;}
  const msg=document.getElementById("tunerMsg");
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const a=ctx(),an=a.createAnalyser();an.fftSize=2048;a.createMediaStreamSource(stream).connect(an);
    tuner={stream,an,buf:new Float32Array(an.fftSize),sr:a.sampleRate,hist:[]};
    document.getElementById("tunerBtn").textContent="Stop tuner";msg.textContent="Listening… play one string.";
    tuner.timer=setInterval(tunerFrame,60);
  }catch(e){msg.textContent="Couldn't use the microphone. Check your browser allowed it, or use a tuner app.";}
}
function stopTuner(){if(!tuner)return;clearInterval(tuner.timer);tuner.stream.getTracks().forEach(t=>t.stop());tuner=null;
  document.getElementById("tunerBtn").textContent="Start tuner";document.getElementById("tunerMsg").textContent="Tuner off.";}
function goTuner(){show("p1");document.getElementById("tunerCard").scrollIntoView({block:"center"});}

// Pick up where you left off.
(function(){let last=null;try{last=localStorage.getItem("mgl-last");}catch(e){}if(last&&last!=="p0"&&PAGES.some(p=>p[0]===last))show(last);})();
</script>
